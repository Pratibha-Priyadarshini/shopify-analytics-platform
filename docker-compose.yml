version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: xeno-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xeno_fde
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: xeno-backend
    command: npm run dev
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/xeno_fde
      JWT_SECRET: supersecretkey
      SHOPIFY_WEBHOOK_SECRET: your-webhook-secret
      FRONTEND_URL: http://localhost:3000
      PORT: 4000
      NODE_ENV: development
      ENABLE_SCHEDULER: "true"
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xeno-frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
